name: CI

on:
  push:
    # ccr-*: Entwicklungszweige der Claude-Code-Sitzungen, solange dort direkt gepusht wird.
    branches: [main, "ccr-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-und-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet-Cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Formatierung prüfen
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Playwright-Browser installieren
        run: pwsh tests/MietHahn.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Integrationstests starten PostgreSQL, Mailpit und Gotenberg per Testcontainers (Docker ist auf dem Runner vorhanden).
      - name: Tests
        run: >-
          dotnet test --no-build -c Release
          -- --report-trx --results-directory "${{ github.workspace }}/testergebnisse"
          --coverage --coverage-output-format cobertura

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse
          path: testergebnisse/
          retention-days: 14

  docker:
    name: Docker & Restore-Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: App-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: miethahn:test
          cache-from: type=gha,scope=miethahn
          cache-to: type=gha,scope=miethahn,mode=max

      - name: Backup-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: deploy/backup
          load: true
          tags: miethahn-backup:test
          cache-from: type=gha,scope=miethahn-backup
          cache-to: type=gha,scope=miethahn-backup,mode=max

      # Sichern → Volumes löschen → in leere Datenbank wiederherstellen → App startet, Datenstand identisch
      - name: Restore-Test
        run: deploy/backup/restore-test.sh miethahn:test miethahn-backup:test
