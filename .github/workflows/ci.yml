name: CI

on:
  push:
    # ccr-*: development branches of Claude Code sessions, as long as they are pushed to directly.
    branches: [main, "ccr-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      coverage:
        description: "Testabdeckung erfassen (Cobertura im Artefakt, Tests laufen langsamer)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-und-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The tests start several containers and many databases; the runner's default free space is tight.
      - name: Speicherplatz freiräumen
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: NuGet-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Restore already reports advisories as warnings (= errors); this step names them per project.
      - name: Anfällige Pakete prüfen
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages\|hat die folgenden anfälligen Paketen" vulnerable.txt

      # Whitespace only: the build enforces the code style rules (EnforceCodeStyleInBuild, warnings are errors).
      # The order of usings is checked only by the full dotnet format before a commit.
      - name: Formatierung prüfen
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Playwright-Browser installieren
        run: pwsh tests/Elocaro.Web.Tests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      # Integration tests start PostgreSQL, Mailpit and Gotenberg via Testcontainers (Docker is available on the runner).
      # Browser tests on a shared runner now and then lose a page when the network of the machine changes (net::ERR_NETWORK_CHANGED):
      # failed tests run again, twice at most, and only if few failed (a real defect is not retried away).
      - name: Tests
        run: >-
          dotnet test --no-build -c Release
          -- --report-trx --results-directory "${{ github.workspace }}/testergebnisse"
          ${{ inputs.coverage && '--coverage --coverage-output-format cobertura' || '' }}
          --retry-failed-tests 2 --retry-failed-tests-max-tests 10

      - name: Speicherplatz anzeigen
        if: always()
        run: df -h /

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: testergebnisse
          path: testergebnisse/
          retention-days: 14

  docker:
    name: Docker & Restore-Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Installationsskript prüfen
        run: |
          bash -n deploy/install.sh
          ELOCARO_NONINTERACTIVE=1 ELOCARO_DOMAIN=ci.example.de SMTP_HOST=smtp.example.de SMTP_PASSWORD='a$b"c' deploy/install.sh --nur-env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config > /dev/null
          rm deploy/.env

      - name: App-Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: elocaro:test
          cache-from: type=gha,scope=elocaro
          cache-to: type=gha,scope=elocaro,mode=max

      - name: Backup-Image bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/backup
          load: true
          tags: elocaro-backup:test
          cache-from: type=gha,scope=elocaro-backup
          cache-to: type=gha,scope=elocaro-backup,mode=max

      # Back up → delete volumes → restore into an empty database → app starts, data identical
      - name: Restore-Test
        run: deploy/backup/restore-test.sh elocaro:test elocaro-backup:test
