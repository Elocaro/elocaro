name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }} nach GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: elocaro
            context: .
            file: Dockerfile
          - name: elocaro-backup
            context: .
            file: deploy/backup/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Bauen und veröffentlichen (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GOOGLE_CLIENT_REV=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # OAuth client for "Mit Google verbinden" (repository secrets GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET): reaches the image
          # as a BuildKit secret (not in the build arguments or the layers' commands). Without the secrets the image has no client.
          secrets: |
            google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}
            google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}

  # GitHub release with the changes since the previous tag, generated from the commit subjects: the app reads it for the hint
  # "new version available". Only after both images are published, so that a release in the list always has images.
  release:
    name: GitHub-Release mit Änderungen
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # whole history and all tags: the notes are the commits since the previous tag

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          bash .github/scripts/release-notes.sh "$TAG" > notes.md
          if [ ! -s notes.md ]; then
            echo "Keine Änderungen seit der vorigen Version." > notes.md
          fi
          gh release create "$TAG" --title "Elocaro ${version}" --notes-file notes.md --verify-tag
