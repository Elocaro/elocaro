name: Funktion finanzieren
description: Eine Funktion früher bekommen, indem Sie ihre Umsetzung finanzieren (Feature-Sponsoring)
labels: [sponsoring, enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ablauf und Regeln: [docs/feature-sponsoring.md](../blob/HEAD/docs/feature-sponsoring.md). Es gibt keinen Anspruch auf Annahme; der Code bleibt unter der AGPL-3.0 für alle. Bitte keine Mieterdaten angeben.
  - type: textarea
    id: ziel
    attributes:
      label: Was soll möglich sein?
      description: Beschreiben Sie die Aufgabe, nicht die Lösung.
    validations:
      required: true
  - type: textarea
    id: heute
    attributes:
      label: Wie lösen Sie es heute?
  - type: input
    id: bestand
    attributes:
      label: Größe Ihres Bestands
      placeholder: z. B. 12 Wohnungen in 3 Häusern
  - type: dropdown
    id: groesse
    attributes:
      label: Ihre Einschätzung des Umfangs
      options: [klein (bis 1 Tag), mittel (2–5 Tage), groß (Wochen), weiß nicht]
  - type: input
    id: budget
    attributes:
      label: Wieviel wäre es Ihnen wert? (unverbindlich)
  - type: checkboxes
    id: teilen
    attributes:
      label: Gemeinsam finanzieren
      options:
        - label: Ich bin einverstanden, dass andere sich beteiligen und die Kosten teilen.
