# Local development services (database, mail, PDF, backup). The app itself runs on the host via `dotnet run`.
#   docker compose -f deploy/docker-compose.dev.yml up -d
name: elocaro-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: elocaro
      POSTGRES_PASSWORD: elocaro
      POSTGRES_DB: elocaro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elocaro"]
      interval: 5s
      retries: 10

  # Catches all mails: web UI http://localhost:8025, SMTP localhost:1025
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "1025:1025"
      - "8025:8025"

  # HTML → PDF (Chromium); API http://localhost:3000
  gotenberg:
    image: gotenberg/gotenberg:8.39.0
    command: ["gotenberg", "--chromium-deny-private-ips"]
    ports:
      - "3000:3000"

  # Backup service for the "Datensicherung" page (pg_dump, restic, rclone). The app finds it through Backup:Url in appsettings.Development.json.
  # Backs up the database "elocaro" (another one: ELOCARO_DEV_DATABASE=elocaro_demo) and the volume files; the local repository is the volume backup-repo.
  backup:
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: elocaro
      PGDATABASE: ${ELOCARO_DEV_DATABASE:-elocaro}
      # Development only; the same value stands in appsettings.Development.json
      BACKUP_API_TOKEN: dev-backup-token
    ports:
      - "8081:8080"
    volumes:
      - files:/data
      # Results of the backups: the app on the host reads them from here (Backup:StatusFile in appsettings.Development.json)
      - ./backup-status:/status
      - backup-cache:/cache
      - backup-repo:/repo

volumes:
  postgres-data:
  files:
  backup-cache:
  backup-repo:
