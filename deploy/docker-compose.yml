# MietHahn – production on a VPS
#   cp deploy/.env.example deploy/.env   # adjust values
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: miethahn

services:
  app:
    image: ${MIETHAHN_IMAGE:-ghcr.io/ther00st3r/miethahn:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
    environment:
      ConnectionStrings__MietHahn: "Host=postgres;Database=miethahn;Username=miethahn;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Application__BaseUrl: "https://${MIETHAHN_DOMAIN}/"
      Pdf__GotenbergUrl: "http://gotenberg:3000"
      Mail__SenderAddress: ${MAIL_SENDER}
      Mail__SenderName: ${MAIL_SENDER_NAME:-MietHahn}
      Mail__ReplyTo: ${MAIL_REPLY_TO:-}
      Mail__Smtp__Host: ${SMTP_HOST}
      Mail__Smtp__Port: ${SMTP_PORT:-587}
      Mail__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Mail__Smtp__UserName: ${SMTP_USER:-}
      Mail__Smtp__Password: ${SMTP_PASSWORD:-}
      Backup__StatusFile: /backup-status/backup.json
    volumes:
      - files:/data
      - backup-status:/backup-status:ro
    # internal: database/Gotenberg; external: outbound for SMTP (later FinTS, AI API) and for Caddy
    networks: [intern, extern]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miethahn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: miethahn
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miethahn -d miethahn"]
      interval: 10s
      retries: 10
    networks: [intern]

  # HTML → PDF. Reachable only on the internal network.
  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=60s", "--chromium-auto-start=true"]
    networks: [intern]

  # Nightly backup (pg_dump + file storage) with restic; see docs/betrieb.md
  backup:
    image: ${MIETHAHN_BACKUP_IMAGE:-ghcr.io/ther00st3r/miethahn-backup:latest}
    build:
      context: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repo}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      # S3-compatible targets (e.g. RESTIC_REPOSITORY=s3:https://s3.eu-central-1.amazonaws.com/bucket/miethahn)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    volumes:
      - files:/data
      - backup-status:/status
      - backup-cache:/cache
      # Local repository (default) or SSH key for SFTP targets
      - ${BACKUP_LOCAL_PATH:-./backup-repo}:/repo
      - ${BACKUP_SSH_PATH:-./backup-ssh}:/root/.ssh:ro
    # internal: database; external: upload to the backup target
    networks: [intern, extern]

  # TLS (Let's Encrypt) and reverse proxy
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MIETHAHN_DOMAIN: ${MIETHAHN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [extern]

networks:
  intern:
    internal: true   # database and Gotenberg: no internet access, reachable only by the app
  extern: {}

volumes:
  postgres:
  files:
  backup-status:
  backup-cache:
  caddy-data:
  caddy-config:
