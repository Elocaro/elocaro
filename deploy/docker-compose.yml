# MietHahn – Produktion auf einem VPS
#   cp deploy/.env.example deploy/.env   # Werte anpassen
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: miethahn

services:
  app:
    image: ${MIETHAHN_IMAGE:-ghcr.io/ther00st3r/miethahn:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
    environment:
      ConnectionStrings__MietHahn: "Host=postgres;Database=miethahn;Username=miethahn;Password=${POSTGRES_PASSWORT};GSS Encryption Mode=Disable"
      Anwendung__BasisUrl: "https://${MIETHAHN_DOMAIN}/"
      Pdf__GotenbergUrl: "http://gotenberg:3000"
      Mail__AbsenderAdresse: ${MAIL_ABSENDER}
      Mail__AbsenderName: ${MAIL_ABSENDER_NAME:-MietHahn}
      Mail__AntwortAn: ${MAIL_ANTWORT_AN:-}
      Mail__Smtp__Host: ${SMTP_HOST}
      Mail__Smtp__Port: ${SMTP_PORT:-587}
      Mail__Smtp__Sicherheit: ${SMTP_SICHERHEIT:-StartTls}
      Mail__Smtp__Benutzer: ${SMTP_BENUTZER:-}
      Mail__Smtp__Passwort: ${SMTP_PASSWORT:-}
      Backup__StatusDatei: /backup-status/backup.json
    volumes:
      - dateien:/daten
      - backup-status:/backup-status:ro
    # intern: Datenbank/Gotenberg; extern: ausgehend für SMTP (später FinTS, KI-API) und für Caddy
    networks: [intern, extern]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miethahn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORT}
      POSTGRES_DB: miethahn
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miethahn -d miethahn"]
      interval: 10s
      retries: 10
    networks: [intern]

  # HTML → PDF. Nur im internen Netz erreichbar.
  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=60s", "--chromium-auto-start=true"]
    networks: [intern]

  # Nächtliche Sicherung (pg_dump + Dateiablage) mit restic; siehe docs/betrieb.md
  backup:
    image: ${MIETHAHN_BACKUP_IMAGE:-ghcr.io/ther00st3r/miethahn-backup:latest}
    build:
      context: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORT}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repo}
      RESTIC_PASSWORD: ${RESTIC_PASSWORT}
      BACKUP_ZEIT: ${BACKUP_ZEIT:-02:30}
      BACKUP_BEHALTEN_TAGE: ${BACKUP_BEHALTEN_TAGE:-7}
      BACKUP_BEHALTEN_WOCHEN: ${BACKUP_BEHALTEN_WOCHEN:-4}
      BACKUP_BEHALTEN_MONATE: ${BACKUP_BEHALTEN_MONATE:-12}
      # S3-kompatible Ziele (z. B. RESTIC_REPOSITORY=s3:https://s3.eu-central-1.amazonaws.com/bucket/miethahn)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    volumes:
      - dateien:/daten
      - backup-status:/status
      - backup-cache:/cache
      # Lokales Repository (Standard) bzw. SSH-Schlüssel für SFTP-Ziele
      - ${BACKUP_LOKAL_PFAD:-./backup-repo}:/repo
      - ${BACKUP_SSH_PFAD:-./backup-ssh}:/root/.ssh:ro
    # intern: Datenbank; extern: Upload zum Backup-Ziel
    networks: [intern, extern]

  # TLS (Let's Encrypt) und Reverse-Proxy
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MIETHAHN_DOMAIN: ${MIETHAHN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
      - caddy-konfig:/config
    networks: [extern]

networks:
  intern:
    internal: true   # Datenbank und Gotenberg: kein Internetzugang, nur für die App erreichbar
  extern: {}

volumes:
  postgres:
  dateien:
  backup-status:
  backup-cache:
  caddy-daten:
  caddy-konfig:
