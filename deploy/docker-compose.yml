# MietHahn – Produktion auf einem VPS
#   cp deploy/.env.example deploy/.env   # Werte anpassen
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: miethahn

services:
  app:
    image: ${MIETHAHN_IMAGE:-ghcr.io/ther00st3r/miethahn:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
    environment:
      ConnectionStrings__MietHahn: "Host=postgres;Database=miethahn;Username=miethahn;Password=${POSTGRES_PASSWORT};GSS Encryption Mode=Disable"
      Anwendung__BasisUrl: "https://${MIETHAHN_DOMAIN}/"
      Pdf__GotenbergUrl: "http://gotenberg:3000"
      Mail__AbsenderAdresse: ${MAIL_ABSENDER}
      Mail__AbsenderName: ${MAIL_ABSENDER_NAME:-MietHahn}
      Mail__AntwortAn: ${MAIL_ANTWORT_AN:-}
      Mail__Smtp__Host: ${SMTP_HOST}
      Mail__Smtp__Port: ${SMTP_PORT:-587}
      Mail__Smtp__Sicherheit: ${SMTP_SICHERHEIT:-StartTls}
      Mail__Smtp__Benutzer: ${SMTP_BENUTZER:-}
      Mail__Smtp__Passwort: ${SMTP_PASSWORT:-}
    volumes:
      - dateien:/daten
    # intern: Datenbank/Gotenberg; extern: ausgehend für SMTP (später FinTS, KI-API) und für Caddy
    networks: [intern, extern]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miethahn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORT}
      POSTGRES_DB: miethahn
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miethahn -d miethahn"]
      interval: 10s
      retries: 10
    networks: [intern]

  # HTML → PDF. Nur im internen Netz erreichbar.
  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=60s", "--chromium-auto-start=true"]
    networks: [intern]

  # TLS (Let's Encrypt) und Reverse-Proxy
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MIETHAHN_DOMAIN: ${MIETHAHN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
      - caddy-konfig:/config
    networks: [extern]

networks:
  intern:
    internal: true   # Datenbank und Gotenberg: kein Internetzugang, nur für die App erreichbar
  extern: {}

volumes:
  postgres:
  dateien:
  caddy-daten:
  caddy-konfig:
